name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Le SDK Android est déjà installé sur les machines GitHub (ANDROID_HOME).
      - run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aiwa-asb060-remote
          path: app/build/outputs/apk/release/app-release.apk
      # Après l'envoi de l'APK, pour qu'il soit disponible même si un test échoue.
      - run: ./gradlew testDebugUnitTest
