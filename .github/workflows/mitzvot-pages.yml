name: Louah HaMitsvot (GitHub Pages)

on:
  push:
    branches: [ "ccr-59d84ff1-ltjyl2", "claude/aiwa-asb-060-remote-app-rcl6z1" ]
    paths: [ "mitzvot/**", ".github/workflows/mitzvot-pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mitzvot-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le calcul des mitsvot
        run: node mitzvot/tests/verifier.js
      - name: Construire le site
        run: bash mitzvot/pwa/build.sh "$GITHUB_WORKSPACE/_site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
